name: Update rate data

on:
  schedule:
    # Every 5 min, UTC hours 0-15 only = 08:00-23:59 MYR (UTC+8).
    # Paused 00:00-08:00 MYR (UTC 16:00-23:59) — see README "Changing the refresh schedule".
    - cron: "*/5 0-15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch-data.mjs"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npm run fetch-data

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --cached --quiet || git commit -m "chore: refresh rate data"
          git push
